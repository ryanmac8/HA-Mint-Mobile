name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # RELEASE_PLEASE_TOKEN (a PAT or GitHub App token) is strongly
          # preferred: PRs opened with the default GITHUB_TOKEN do not trigger
          # other workflows, so the required "e2e" check would never run on the
          # release PR and it could not be merged. The fallback keeps this
          # workflow functional until that secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise outcome
        run: |
          echo "release_created=${{ steps.release.outputs.release_created }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag_name=${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
